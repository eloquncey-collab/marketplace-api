version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: marketplace_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marketplace
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: marketplace_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/marketplace
      SECRET_KEY: t0h8HYj14VmCg5QZC3RFki034wbeliFLo6yiuJqxoje
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: